<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neeman's Performance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .neemans-green { color: #2d5a27; }
        .bg-neemans { background-color: #2d5a27; }
    </style>
</head>
<body class="p-6">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-xl shadow-sm border-l-8 border-green-800">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">NEEMAN'S</h1>
            <p class="text-gray-500">Sales Performance Overview (50 Transactions)</p>
        </div>
        <div class="text-right">
            <span id="currentDate" class="font-semibold text-gray-600"></span>
        </div>
    </header>

    <!-- Top Section: Recent Transactions Table -->
    <div class="grid grid-cols-1 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm overflow-hidden">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Recent Transactions (Product, Channel, Date)</h2>
            <div class="overflow-y-auto max-h-64">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Product Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Channel</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">SKU</th>
                        </tr>
                    </thead>
                    <tbody id="topTableBody" class="bg-white divide-y divide-gray-200 text-sm">
                        <!-- Data injected by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Middle Section: KPI Metrics -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border-b-4 border-green-500">
            <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Total Revenue</p>
            <h3 id="totalRevenue" class="text-2xl font-bold text-gray-800 mt-2">₹0</h3>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border-b-4 border-blue-500">
            <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Avg. Selling Price</p>
            <h3 id="avgPrice" class="text-2xl font-bold text-gray-800 mt-2">₹0</h3>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border-b-4 border-yellow-500">
            <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Discounts Offered</p>
            <h3 id="totalDiscounts" class="text-2xl font-bold text-gray-800 mt-2">₹0</h3>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border-b-4 border-red-500">
            <p class="text-sm text-gray-500 uppercase font-bold tracking-wider">Returns</p>
            <h3 id="totalReturns" class="text-2xl font-bold text-gray-800 mt-2">0</h3>
        </div>
    </div>

    <!-- Bottom Section: Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- SKU Sales -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Sales by SKU</h2>
            <canvas id="skuChart" height="250"></canvas>
        </div>
        <!-- Sales vs Returns -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Order Fulfillment Status</h2>
            <canvas id="returnChart" height="250"></canvas>
        </div>
        <!-- Geographic Sales -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Sales by Region</h2>
            <canvas id="geoChart" height="250"></canvas>
        </div>
    </div>

    <script>
        // 1. Data Generation (50 Rows)
        const products = ["Tree Sneakers", "Relive Knits", "Wool Joggers", "Cotton Classics", "Eco Slides"];
        const channels = ["Direct Website", "Amazon", "Myntra", "Nykaa Fashion"];
        const regions = ["North India", "South India", "West India", "East India", "Central India"];
        const skus = ["NEM-TS-01", "NEM-RK-02", "NEM-WJ-03", "NEM-CC-04", "NEM-ES-05"];
        
        let salesData = [];
        for (let i = 0; i < 50; i++) {
            let price = Math.floor(Math.random() * (4500 - 2500) + 2500);
            let discount = Math.floor(Math.random() * 500);
            let isReturned = Math.random() < 0.15; // 15% return rate
            
            salesData.push({
                id: i + 1,
                date: `2023-10-${(i % 28) + 1}`,
                product: products[Math.floor(Math.random() * products.length)],
                sku: skus[Math.floor(Math.random() * skus.length)],
                channel: channels[Math.floor(Math.random() * channels.length)],
                region: regions[Math.floor(Math.random() * regions.length)],
                sellingPrice: price,
                discount: discount,
                revenue: price - discount,
                status: isReturned ? "Returned" : "Sold"
            });
        }

        // 2. Populate UI
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-IN', { dateStyle: 'long' });

        const tableBody = document.getElementById('topTableBody');
        let totalRev = 0;
        let totalDisc = 0;
        let totalRet = 0;
        let skuCounts = {};
        let regionCounts = {};

        salesData.forEach(row => {
            // Table
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap text-gray-600">${row.date}</td>
                <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${row.product}</td>
                <td class="px-6 py-4 whitespace-nowrap text-gray-600">
                    <span class="px-2 py-1 bg-gray-100 rounded text-xs">${row.channel}</span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-gray-500 font-mono text-xs">${row.sku}</td>
            `;
            tableBody.appendChild(tr);

            // KPI Calculations
            totalRev += row.revenue;
            totalDisc += row.discount;
            if (row.status === "Returned") totalRet++;

            // Chart Data Prep
            skuCounts[row.product] = (skuCounts[row.product] || 0) + 1;
            regionCounts[row.region] = (regionCounts[row.region] || 0) + row.revenue;
        });

        // Update Middle KPIs
        document.getElementById('totalRevenue').innerText = `₹${totalRev.toLocaleString()}`;
        document.getElementById('avgPrice').innerText = `₹${Math.floor(totalRev / 50).toLocaleString()}`;
        document.getElementById('totalDiscounts').innerText = `₹${totalDisc.toLocaleString()}`;
        document.getElementById('totalReturns').innerText = totalRet;

        // 3. Initialize Charts
        
        // SKU Chart
        new Chart(document.getElementById('skuChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(skuCounts),
                datasets: [{
                    label: 'Units Sold',
                    data: Object.values(skuCounts),
                    backgroundColor: '#2d5a27',
                    borderRadius: 5
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });

        // Return Chart
        new Chart(document.getElementById('returnChart'), {
            type: 'doughnut',
            data: {
                labels: ['Delivered', 'Returned'],
                datasets: [{
                    data: [50 - totalRet, totalRet],
                    backgroundColor: ['#10b981', '#ef4444'],
                    hoverOffset: 4
                }]
            }
        });

        // Geo Chart
        new Chart(document.getElementById('geoChart'), {
            type: 'polarArea',
            data: {
                labels: Object.keys(regionCounts),
                datasets: [{
                    data: Object.values(regionCounts),
                    backgroundColor: [
                        'rgba(45, 90, 39, 0.7)',
                        'rgba(59, 130, 246, 0.7)',
                        'rgba(245, 158, 11, 0.7)',
                        'rgba(139, 92, 246, 0.7)',
                        'rgba(236, 72, 153, 0.7)'
                    ]
                }]
            },
            options: { responsive: true }
        });
    </script>
</body>
</html>
